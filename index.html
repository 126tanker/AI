<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Academic Advisor Decision App - Enhanced (Electives + Planner)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --primary:#1f3c88;
      --bg:#f4f6f8;
      --card:#ffffff;
      --muted:#e9edf5;
      --muted-hover:#d0daf0;
      --accent:#2b66ff;
      --success:#0f9d58;
      --warn:#c27803;
      --danger:#b00020;
    }
    html,body{height:100%}
    body{font-family: Arial, sans-serif;margin: 0;background: var(--bg);color:#17223b;}
    header{background: var(--primary);color:white;padding: 12px 18px;display:flex;align-items:center;gap:12px;flex-wrap: wrap;}
    h1{margin:0;font-size:22px}
    .app-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
    .app-actions button{background:#ffffff1a;border:1px solid #ffffff3a;color:white;padding:6px 10px;border-radius:6px;cursor:pointer}
    .app-actions button:hover{background:#ffffff2e}
    #container{max-width: 980px; margin: 20px auto; padding: 12px;}
    .progress{background:#e0e0e0;height:8px;border-radius:4px;margin-bottom:16px}
    .progress-bar{height:100%;width:0%;background:var(--primary);border-radius:4px;transition:width .25s ease}
    .card{background:var(--card);padding:20px;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,.08)}
    .question{font-size:18px;margin-bottom:14px}
    .options button{display:block;width:100%;margin:8px 0;padding:12px;font-size:15px;border:none;border-radius:6px;cursor:pointer;background:var(--muted);transition:background .2s}
    .options button:hover{background:var(--muted-hover)}
    .summary{background:#eef3ff;padding:15px;margin-top:16px;border-left:5px solid var(--primary)}
    .nav-controls{margin-top:16px;display:flex;gap:8px;justify-content:space-between;align-items:center}
    .nav-controls .left{display:flex;gap:8px}
    .nav-controls .right{display:flex;gap:8px}
    .nav-controls button{padding:8px 12px}
    .pill{display:inline-block;background:#eef3ff;border:1px solid #d0daf0;color:#1f2a44;padding:4px 8px;border-radius:999px;font-size:12px;margin:2px}
    .section-title{margin:10px 0 6px;font-weight:bold}
    .note{font-size:12px;color:#555}
    .muted{color:#6b7280}
    .error{color:var(--danger)}
    /* Modal */
    .modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;}
    .modal[open]{display:flex}
    .modal .modal-card{background:white;max-width:1000px;width:100%;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);} 
    .modal header{background:transparent;color:#17223b;padding:16px;border-bottom:1px solid #eee}
    .modal .content{padding:16px;max-height:70vh;overflow:auto}
    .modal footer{padding:12px 16px;border-top:1px solid #eee;display:flex;gap:8px;justify-content:flex-end}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
    .field{display:flex;flex-direction:column;gap:4px}
    .field input,.field select,.field textarea{padding:8px;border:1px solid #cfd8dc;border-radius:6px}
    .kbd{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;background:#f1f5f9;border:1px solid #e2e8f0;border-bottom-width:2px;padding:1px 6px;border-radius:4px;font-size:12px}
    details{background:#fafbff;border:1px solid #e6ecff;border-radius:8px;padding:10px;margin:8px 0}
    details > summary{cursor:pointer;font-weight:bold}
    .success{color:var(--success)}
    .warn{color:var(--warn)}
    .badge{display:inline-block;padding:2px 6px;border-radius:6px;background:#f1f5f9;border:1px solid #e2e8f0;font-size:11px;color:#334155;margin-left:6px}
    .disabled{opacity:.5;pointer-events:none}
    .course-card{border:1px solid #e5e7eb;border-radius:8px;padding:10px;margin:6px 0;background:#fff}
    .course-card .title{font-weight:bold}
    .course-card .meta{font-size:12px;color:#6b7280;margin-top:4px}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media (max-width: 720px){ .two-col{grid-template-columns:1fr} }
	
	/* NEW: Hide the Select All Displayed button */
button[data-role="hide-select-all"] {
    display: none !important;
}
	
  </style>
</head>
<body>
<header>
  <h1 id="appTitle">Academic Advising Decision Support Tool (Enhanced)</h1>
  <div class="app-actions" aria-label="App actions">
    <button id="btnRestart" title="Restart (Alt+R)">Restart</button>
    <button id="btnSave" title="Save session (Alt+S)">Save</button>
    <button id="btnLoad" title="Load session (Alt+L)">Load</button>
    <button id="btnExport" title="Export summary to JSON (Alt+J)">Export JSON</button>
    <button id="btnPrint" title="Print summary (Ctrl/Cmd+P)">Print</button>
    <button id="btnPlacement" title="Open placement helper (Alt+P)">Placement Helper</button>
  </div>
</header>
<div id="container">
  <div class="progress" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
  <div class="card" role="region" aria-labelledby="questionHeading">
    <div class="question" id="questionText" aria-live="polite"></div>
    <div class="options" id="optionsContainer" role="group" aria-label="Options"></div>
    <div class="summary" id="summaryBox" style="display:none;"></div>
    <div class="nav-controls">
      <div class="left">
        <button onclick="goBack()" id="btnBack" title="Go back (Alt+Left)">Back</button>
        <button onclick="restart()" id="btnRestartInline">Restart</button>
      </div>
      <div class="right">
        <span class="note">Tip: Use <span class="kbd">1</span>, <span class="kbd">2</span>, ... to choose options; <span class="kbd">B</span> to go Back.</span>
      </div>
    </div>
  </div>
</div>

<!-- Placement Helper Modal -->
<dialog class="modal" id="placementModal">
  <div class="modal-card">
    <header>
      <h2>Placement Helper</h2>
      <p class="note">Enter any scores you have; leave others blank.</p>
    </header>
    <div class="content">
      <div class="grid">
        <div class="field"><label>High School GPA</label><input type="number" step="0.01" id="ph_gpa" placeholder="e.g., 3.2"></div>
        <div class="field"><label>ACT Reading</label><input type="number" id="ph_act_read"></div>
        <div class="field"><label>ACT English (Writing & Language)</label><input type="number" id="ph_act_eng"></div>
        <div class="field"><label>ACT Math</label><input type="number" id="ph_act_math"></div>
        <div class="field"><label>SAT Evidence-Based Reading & Writing</label><input type="number" id="ph_sat_ebrw"></div>
        <div class="field"><label>SAT Writing & Language</label><input type="number" id="ph_sat_wl"></div>
        <div class="field"><label>SAT Math</label><input type="number" id="ph_sat_math"></div>
        <div class="field"><label>GED (if applicable)</label><input type="number" id="ph_ged"></div>
        <div class="field"><label>Accuplacer (Reading/Writing)</label><input type="number" id="ph_acc_rw"></div>
        <div class="field"><label>KYOTE College Algebra (CA)</label><input type="number" id="ph_kyote_ca"></div>
        <div class="field"><label>KYOTE Math Placement (MP)</label><input type="number" id="ph_kyote_mp"></div>
        <div class="field"><label>KYOTE KALG (CA - alternative)</label><input type="number" id="ph_kyote_kalg"></div>
      </div>
      <details open>
        <summary>Results</summary>
        <div id="placementResults"></div>
      </details>
    </div>
    <footer>
      <button onclick="document.getElementById('placementModal').close()">Close</button>
      <button class="success" onclick="computePlacement()">Recompute</button>
    </footer>
  </div>
</dialog>

<!-- Course Planner Modal -->
<dialog class="modal" id="plannerModal">
  <div class="modal-card">
    <header>
      <h2>Plan Remaining Courses (Prereqs/Coreqs Enforced)</h2>
      <label class="note"><input type="checkbox" id="planner_consent"> Allow instructor consent overrides when available</label>
    </header>
    <div class="content" id="plannerContent">
      <!-- dynamically rendered -->
    </div>
    <footer>
      <button onclick="document.getElementById('plannerModal').close()">Close</button>
      <button class="success" onclick="applyPlannerSelections()">Save Plan</button>
    </footer>
  </div>
</dialog>

function renderNode(nodeKey){
  const node = decisionTree[nodeKey];

  if(nodeKey === "trackCourseInput"){ renderCourseSelection(); return; }
  if(nodeKey === "end"){ renderSummary(); return; }

  // --- NEW: auto-skip the "credits" step; compute & jump to summary
  if(nodeKey === "credits"){
    const res = calculateCompletedCreditsFromSelections();
    studentProfile.creditsCalculated = res.total;
    studentProfile.creditsCountedCourses = res.counted; // for debugging/trace
    currentNode = "end";
    renderNode(currentNode);
    updateProgress(Math.min(historyStack.length * 10, 95));
    return;
  }

  document.getElementById("questionText").innerText = node.question;
  node.options.forEach((option, idx)=>{
    const btn = document.createElement("button");
    btn.innerText = option.text;
    btn.setAttribute('data-idx', idx+1);
    btn.onclick = () => { applyOption(option); };
    container.appendChild(btn);
  });
}
function applyOption(option){
  historyStack.push({ node: currentNode, profileSnapshot: JSON.parse(JSON.stringify(studentProfile)) });
  if(option.set){ Object.assign(studentProfile, option.set); }
  if(option.action){ try{ option.action(); }catch(e){ console.warn(e); } }
  currentNode = option.next;
  renderNode(currentNode);
  updateProgress(Math.min(historyStack.length * 10, 95));
}

    if(credited.has(cb.value)){
      cb.checked = true; cb.disabled = true; cb.parentElement.title = 'Credited by certification'; cb.parentElement.style.opacity = .85;

  });

// --- NEW: Completed Credit Calculator (CIT-only, from explicit codes) ---
function calculateCompletedCreditsFromSelections(){
  const selected = new Set([
    ...(studentProfile.completedCourses || []),
    ...(studentProfile.creditedCourses || [])
  ]);
  let total = 0;
  const counted = [];

  selected.forEach(code => {
    // Count only explicit course codes like "CIT 170"
    const m = String(code).trim().match(/^[A-Z]{2,4}\s?\d{3,4}$/);
    if(m){
      const norm = m[0].replace(/\s+/g,' ').trim();
      const rule = courseRules[norm];
      if(rule && typeof rule.credits === 'number'){
        total += rule.credits;
        counted.push(norm);
      }
    }
  });
  return { total, counted };
}

    return isRequirementSatisfied(req, completed);

  const remaining = reqs.filter(req => !satisfiedWithElectives(req));
  const satisfied = reqs.filter(req => satisfiedWithElectives(req));
  const genEdReqs = trackData.generalEducation;
  const completedGenEdKeys = new Set(Object.keys(studentProfile.generalEducationCourses||{}));
  const remainingGenEd = genEdReqs.filter(k => !completedGenEdKeys.has(k));
  const creditedPills = (studentProfile.creditedCourses||[]).map(c=>`<span class="pill">${c}</span>`).join(' ');

  const plannedPills = (studentProfile.plannedCourses||[]).map(c=>`<span class="pill">${c}</span>`).join(' ');
  const electivePlanPills = Object.entries(studentProfile.electiveSelections||{}).map(([slotKey,obj])=>`<span class="pill">${obj.label} → ${obj.course}</span>`).join(' ');

  box.innerHTML = `
    <strong>Program:</strong> ${studentProfile.program}<br>
    <strong>Needs Major Update:</strong> ${studentProfile.needsMajorUpdate === null ? 'Unknown' : (studentProfile.needsMajorUpdate ? 'Yes':'No')}<br>
    <strong>Has Hold:</strong> ${studentProfile.hasHold === null ? 'Unknown' : (studentProfile.hasHold ? 'Yes':'No')}<br>
    <strong>Track:</strong> ${track || 'Not Selected'}<br>
    <strong>Credits Completed:</strong> ${studentProfile.credits || 'Unknown'}
	${studentProfile.creditsCalculated} <span class="note">(CIT/technical only; GenEd not counted yet)</span>
    <hr>
    <div><strong>Completed (including certification credits):</strong><br>
      ${Array.from(completed).map(c=>`<span class="pill">${c}</span>`).join(' ') || '<span class="note">None selected</span>'}
    </div>
    ${creditedPills ? `<div class="note">Auto-credited by certifications: ${creditedPills}</div>` : ''}
    <div style="margin-top:8px"><strong>Remaining Program/Track Courses:</strong><br>
      ${remaining.length? remaining.map(c=>`<span class="pill">${c}</span>`).join(' ') : '<span class="success">No remaining courses detected based on selections</span>'}
    </div>
    ${plannedPills || electivePlanPills ? `<div style="margin-top:8px"><strong>Planned (not yet completed):</strong><br>${plannedPills} ${electivePlanPills}</div>` : ''}
    <div style="margin-top:8px"><strong>General Education Entered:</strong><br>
      ${(Object.entries(studentProfile.generalEducationCourses||{}).map(([k,v])=>`<span class="pill">${k}: ${v}</span>`).join(' ')) || '<span class="note">None entered</span>'}
    </div>
    <div style="margin-top:8px"><strong>Remaining General Education Attributes:</strong><br>
      ${remainingGenEd.length? remainingGenEd.map(c=>`<span class="pill">${c}</span>`).join(' ') : '<span class="success">All GenEd attributes recorded</span>'}
    </div>
    <hr>
    <div class="note">Use the buttons in the header to Save, Load, Export JSON, or Print this summary.</div>
  `;

  // Render action buttons below
  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  const toTop = document.createElement('button');
  toTop.innerText = 'Finish & Show Summary';
  toTop.onclick = () => window.scrollTo({top:0,behavior:'smooth'});
  container.appendChild(toTop);

  const planBtn = document.createElement('button');
  planBtn.innerText = 'Open Course Planner (enforce prereqs/coreqs)';
  planBtn.onclick = () => openPlanner();
  container.appendChild(document.createTextNode(' '));
  container.appendChild(planBtn);

  latestSummaryObject = { timestamp: new Date().toISOString(), studentProfile, trackData, satisfied, remaining, remainingGenEd };
}

function isRequirementSatisfied(req, completedSet){
  // Handle patterns like "CIT 160/161" or "CIT 144 or 171" or "CIT 257 or CIT 258"
  const normalized = req.replace(/\s+/g,' ').trim();
  if(normalized.includes('/')){ const parts = normalized.split('/').map(s => s.trim()); return parts.some(p => completedSet.has(p)); }
  if(/\bor\b/i.test(normalized)){ const parts = normalized.split(/\bor\b/i).map(s => s.trim()); return parts.some(p => completedSet.has(p)); }
  // Generic placeholders like Elective can't be auto-satisfied
  if(/elective/i.test(normalized) || /Approved Level/i.test(normalized)){ return false; }
  return completedSet.has(normalized);
}

function computePlacement(){
  const gpa = parseFloat(document.getElementById('ph_gpa').value);
  const actR = parseFloat(document.getElementById('ph_act_read').value);
  const actE = parseFloat(document.getElementById('ph_act_eng').value);
  const actM = parseFloat(document.getElementById('ph_act_math').value);
  const satEBRW = parseFloat(document.getElementById('ph_sat_ebrw').value);
  const satWL = parseFloat(document.getElementById('ph_sat_wl').value);
  const satM = parseFloat(document.getElementById('ph_sat_math').value);
  const ged = parseFloat(document.getElementById('ph_ged').value);
  const accuRW = parseFloat(document.getElementById('ph_acc_rw').value);
  const kyCA = parseFloat(document.getElementById('ph_kyote_ca').value);
  const kyMP = parseFloat(document.getElementById('ph_kyote_mp').value);
  const kyKALG = parseFloat(document.getElementById('ph_kyote_kalg').value);
  const engDirect = ((actR>=20 || satEBRW>=490 || (accuRW>=250) || (ged>=165) || (gpa>=3.0)) && (actE>=18 || satWL>=22 || satEBRW>=490 || (accuRW>=250) || (ged>=165) || (gpa>=3.0)) );
  const engPaired = (((actR>=16 && actR<=19) || (accuRW>=228 && accuRW<=249) || (gpa>=2.0 && gpa<3.0)) && ((actE>=16 && actE<=19) || (accuRW>=228 && accuRW<=249) || (gpa>=2.0 && gpa<3.0)) );
  const engReferral = ((actR>0 && actR<=15) || (actE>0 && actE<=13));
  let engPlacement = 'Insufficient data';
  if(engDirect){ engPlacement = 'ENG 101'; }
  else if(engPaired){ engPlacement = 'ENG 101 + IRW 100 + FYE 110 (coreq)'; }
  else if(engReferral){ engPlacement = 'Referral to Adult Education'; }
  let mathPlacement = 'Insufficient data';
  if(actM>=27 || satM>=640 || kyCA>=15){ mathPlacement = 'Eligible for MAT 175'; }
  else if((actM>=22 && actM<=26) || (satM>=540 && satM<=639) || (gpa>=3.2) || kyCA>=14){ mathPlacement = 'Eligible for MAT 150 or MAT 155'; }
  else if((actM>=19 && actM<=21) || (satM>=510 && satM<=539) || (ged>=165 && ged<=174) || (gpa>=3.0 && gpa<=3.19) || (kyCA>=7 && kyCA<=13) || (kyMP>=22)){
    mathPlacement = 'Eligible for MAT 150 (with MAT 100 coreq), or MAT 146/126/105';
  }
  const html = `
    <p><strong>English (College Writing I):</strong> <span>${engPlacement}</span></p>
    <ul class="note">
      <li>If <em>ENG 101</em>, then student meets the College Writing I attribute.</li>
      <li>If <em>ENG 101 + IRW 100 + FYE 110</em>, schedule those together.</li>
      <li>If <em>Referral</em>, student should work with Adult Education.</li>
    </ul>
    <p><strong>Math (Qualitative Reasoning attribute):</strong> <span>${mathPlacement}</span></p>`;
  document.getElementById('placementResults').innerHTML = html;
}

function openPlanner(){
  const dlg = document.getElementById('plannerModal');
  const content = document.getElementById('plannerContent');
  const trackData = courseCatalog[studentProfile.track] || {required:[], trackSpecific:[], generalEducation:[]};
  const completed = new Set([...(studentProfile.completedCourses||[]), ...(studentProfile.creditedCourses||[])]);
  const reqs = [...trackData.required, ...trackData.trackSpecific];
  const remainingReqs = reqs.filter(r => !isRequirementSatisfied(r, completed));

  // Split specific courses vs elective slots
  const specificCourses = [];
  const electiveSlots = [];
  remainingReqs.forEach(r=>{
    if(/^CIT\s?\d{3}(\s|$)/.test(r)){ // explicit course or alternatives
      // if contains 'or' or '/', add each as option? Planner will show each alternative separately
      if(r.includes('/') || /\bor\b/i.test(r)){
        const alts = r.includes('/') ? r.split('/') : r.split(/\bor\b/i);
        alts.map(s=>s.trim()).forEach(code => specificCourses.push(code));
      } else {
        specificCourses.push(r.trim());
      }
    } else {
      electiveSlots.push(r.trim());
    }
  });

  const consent = document.getElementById('planner_consent').checked;
  const plannedSet = new Set(studentProfile.plannedCourses || []);
  const plannedElectives = studentProfile.electiveSelections || {};

  // Build HTML
  let html = '';
  html += '<div class="two-col">';
  html += '<div>';
  html += '<div class="section-title">Remaining Specific Courses</div>';
  if(specificCourses.length===0){ html += '<div class="note">None</div>'; }
  specificCourses.forEach(code=>{
    const rule = courseRules[code];
    const elig = checkEligibility(code, consent);
    const disabled = !elig.ok;
    const reasons = [...(elig.missingPrereqs||[]), ...(elig.missingCoreqs||[])];
    html += `<div class="course-card">
      <div class="title">${code} ${rule?('— '+rule.title):''}
        ${rule&&rule.approvedElectiveLevel?`<span class="badge">Approved Elective ${rule.approvedElectiveLevel}-level</span>`:''}
      </div>
      <div class="meta">${rule? `${rule.credits} credits` : ''}</div>
      ${!elig.ok ? `<div class="error">Cannot plan yet: needs ${reasons.join(', ')}</div>` : ''}
      <label class="note"><input type="checkbox" class="plan-course" value="${code}" ${plannedSet.has(code)?'checked':''} ${disabled?'disabled':''}> Plan this course</label>
    </div>`;
  });
  html += '</div>';

  html += '<div>';
  html += '<div class="section-title">Elective Slots</div>';
  if(electiveSlots.length===0){ html += '<div class="note">No elective slots remaining.</div>'; }
  const completedSet = new Set([...(studentProfile.completedCourses||[]), ...(studentProfile.creditedCourses||[])]);

  electiveSlots.forEach((slot,idx)=>{
    // Determine allowed list for this slot
    let allowed = [];
    if(/200-Level CIT Elective/i.test(slot)){
      allowed = approvedElectivesByLevel['200'];
    } else if(/CIT Elective/i.test(slot)){
      // allow both levels
      allowed = [...approvedElectivesByLevel['100'], ...approvedElectivesByLevel['200']];
    } else {
      allowed = [...approvedElectivesByLevel['100'], ...approvedElectivesByLevel['200']];
    }
    // remove those already completed
    allowed = allowed.filter(c => !completedSet.has(c));
    // Sort by code
    allowed.sort();

    const selId = `slot_${idx}`;
    const slotKey = `slot_${idx}`;
    const preSel = plannedElectives[slotKey]?.course || '';

    html += `<div class="course-card">
      <div class="title">${slot}</div>
      <div class="meta">Choose one that meets prerequisites</div>
      <div class="field">
        <label for="${selId}">Approved options</label>
        <select id="${selId}" data-slotkey="${slotKey}" data-slotlabel="${slot}">
          <option value="">-- Select an approved elective --</option>
          ${allowed.map(code=>{
            const e = checkEligibility(code, consent);
            const rule = courseRules[code];
            const reasons = [...(e.missingPrereqs||[]), ...(e.missingCoreqs||[])];
            const label = `${code} — ${rule?rule.title:''}` + (rule&&rule.approvedElectiveLevel?` [${rule.approvedElectiveLevel}-level]`:'' );
            const disabled = e.ok? '' : 'disabled';
            const selected = (preSel===code)? 'selected' : '';
            return `<option value="${code}" ${disabled} ${selected} title="${e.ok?'Eligible':('Needs '+reasons.join(', '))}">${label}</option>`;
          }).join('')}
        </select>
        ${preSel?`<div class="note">Previously selected: ${preSel}</div>`:''}
      </div>
    </div>`;
  });
  html += '</div>';
  html += '</div>';

  // Attach live update handlers
  setTimeout(()=>{
    document.querySelectorAll('#plannerContent .plan-course').forEach(cb=>{ cb.addEventListener('change', updateElectiveOptionStates); });
    updateElectiveOptionStates();
  },0);

  // Info area
  html += `<details open style="margin-top:8px">
    <summary>How eligibility is checked</summary>
    <div class="note">We verify course prerequisites and corequisites against your completed and certification-credited courses. If "Allow instructor consent" is checked and a course permits consent, you may plan it even if some requirements are unmet.</div>
  </details>`;

// --- NEW: Placement Helper quick-access in Planner header ---

function checkEligibility(code, allowConsent){
  const rule = courseRules[code];
  if(!rule){ return {ok:true, missingPrereqs:[], missingCoreqs:[]}; }
  const completed = new Set([...(studentProfile.completedCourses||[]), ...(studentProfile.creditedCourses||[]), ...(studentProfile.plannedCourses||[])]);
  // Prereqs
  const missingPrereqs = [];
  const p = rule.prereq || {allOf:[]};
  (p.allOf||[]).forEach(group=>{
    const anyOf = group.anyOf||[];
    // Only enforce explicit course prerequisites; other tokens are advisory
    const courseOptions = anyOf.filter(x=>x.course).map(x=>x.course);
    if(courseOptions.length>0){
      const satisfied = courseOptions.some(c => completed.has(c));
      if(!satisfied){ missingPrereqs.push(`one of (${courseOptions.join(' or ')})`); }
    }
  });
  // Coreqs
  const missingCoreqs = [];
  const c = rule.coreq || {anyOf:[], allOf:[]};
  // allOf coreqs must be present or planned
  (c.allOf||[]).forEach(x=>{ if(x.course && !completed.has(x.course)){ missingCoreqs.push(x.course); } });
  // anyOf coreq satisfied if any present
  if((c.anyOf||[]).length>0){
    const opts = (c.anyOf||[]).filter(x=>x.course).map(x=>x.course);
    if(opts.length>0){
      const ok = opts.some(cc => completed.has(cc));
      if(!ok){ missingCoreqs.push(`one of (${opts.join(' or ')})`); }
    }
  }
  let ok = (missingPrereqs.length===0 && missingCoreqs.length===0);
  if(!ok && allowConsent && rule.consentAllowed){ ok = true; }
  return {ok, missingPrereqs, missingCoreqs};

function checkEligibilitySnapshot(code, allowConsent, tempPlanned){
  // Same as checkEligibility but accepts a temp planned set for live UI updates
  const rule = courseRules[code];
  if(!rule){ return {ok:true, missingPrereqs:[], missingCoreqs:[]}; }
  const completed = new Set([...(studentProfile.completedCourses||[]), ...(studentProfile.creditedCourses||[])]);
  (tempPlanned||[]).forEach(c=>completed.add(c));
  const missingPrereqs = [];
  const p = rule.prereq || {allOf:[]};
  (p.allOf||[]).forEach(group=>{
    const anyOf = group.anyOf||[];
    const courseOptions = anyOf.filter(x=>x.course).map(x=>x.course);
    if(courseOptions.length>0){
      const satisfied = courseOptions.some(c => completed.has(c));
      if(!satisfied){ missingPrereqs.push(`one of (${courseOptions.join(' or ')})`); }
    }
  });
  const missingCoreqs = [];
  const c = rule.coreq || {anyOf:[], allOf:[]};
  (c.allOf||[]).forEach(x=>{ if(x.course && !completed.has(x.course)){ missingCoreqs.push(x.course); } });
  if((c.anyOf||[]).length>0){
    const opts = (c.anyOf||[]).filter(x=>x.course).map(x=>x.course);
    if(opts.length>0){
      const ok = opts.some(cc => completed.has(cc));
      if(!ok){ missingCoreqs.push(`one of (${opts.join(' or ')})`); }
    }
  }
  let ok = (missingPrereqs.length===0 && missingCoreqs.length===0);
  if(!ok && allowConsent && rule.consentAllowed){ ok = true; }
  return {ok, missingPrereqs, missingCoreqs};
}

function collectTempPlanned(){
  return Array.from(document.querySelectorAll('#plannerContent .plan-course:checked')).map(cb=>cb.value);
}

function updateElectiveOptionStates(){
  const consent = document.getElementById('planner_consent').checked;
  const tempPlanned = collectTempPlanned();
  const selects = Array.from(document.querySelectorAll('#plannerContent select[data-slotkey]'));
  selects.forEach(sel=>{
    Array.from(sel.options).forEach((opt,i)=>{
      if(i===0) return; // skip placeholder
      const code = opt.value;
      const e = checkEligibilitySnapshot(code, consent, tempPlanned);
      opt.disabled = e.ok ? false : true;
      opt.title = e.ok ? 'Eligible' : ('Needs ' + [...(e.missingPrereqs||[]), ...(e.missingCoreqs||[])].join(', '));
    });
  });
}

}

function applyPlannerSelections(){
  const dlg = document.getElementById('plannerModal');
  // Collect specific planned courses
  const checks = Array.from(document.querySelectorAll('#plannerContent .plan-course'));
  const planned = checks.filter(cb=>cb.checked && !cb.disabled).map(cb=>cb.value);
  studentProfile.plannedCourses = Array.from(new Set(planned));
  // Collect elective selections
  const selects = Array.from(document.querySelectorAll('#plannerContent select[data-slotkey]'));
  const electiveSelections = {};
  selects.forEach(sel=>{ if(sel.value){ electiveSelections[sel.dataset.slotkey] = { label: sel.dataset.slotlabel, course: sel.value }; } });
  studentProfile.electiveSelections = electiveSelections;
  toast('Planner selections saved');
  dlg.close();
  // Re-render summary to show planned pills
  renderSummary();
}
