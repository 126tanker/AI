
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Academic Advisor Decision App - Enhanced</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --primary:#1f3c88;
    --bg:#f4f6f8;
    --card:#ffffff;
    --muted:#e9edf5;
    --muted-hover:#d0daf0;
    --accent:#2b66ff;
    --success:#0f9d58;
    --warn:#c27803;
  }
  html,body{height:100%}
  body{
    font-family: Arial, sans-serif;
    margin: 0;
    background: var(--bg);
    color:#17223b;
  }
  header{
    background: var(--primary);
    color:white;
    padding: 12px 18px;
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap: wrap;
  }
  h1{margin:0;font-size:22px}
  .app-actions{
    margin-left:auto;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .app-actions button{
    background:#ffffff1a;
    border:1px solid #ffffff3a;
    color:white;
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
  }
  .app-actions button:hover{background:#ffffff2e}

  #container{max-width: 980px; margin: 20px auto; padding: 12px;}
  .progress{background:#e0e0e0;height:8px;border-radius:4px;margin-bottom:16px}
  .progress-bar{height:100%;width:0%;background:var(--primary);border-radius:4px;transition:width .25s ease}

  .card{background:var(--card);padding:20px;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,.08)}
  .question{font-size:18px;margin-bottom:14px}

  .options button{display:block;width:100%;margin:8px 0;padding:12px;font-size:15px;border:none;border-radius:6px;cursor:pointer;background:var(--muted);transition:background .2s}
  .options button:hover{background:var(--muted-hover)}

  .summary{background:#eef3ff;padding:15px;margin-top:16px;border-left:5px solid var(--primary)}
  .nav-controls{margin-top:16px;display:flex;gap:8px;justify-content:space-between;align-items:center}
  .nav-controls .left{display:flex;gap:8px}
  .nav-controls .right{display:flex;gap:8px}
  .nav-controls button{padding:8px 12px}

  .pill{display:inline-block;background:#eef3ff;border:1px solid #d0daf0;color:#1f2a44;padding:4px 8px;border-radius:999px;font-size:12px;margin:2px}

  .section-title{margin:10px 0 6px;font-weight:bold}
  .note{font-size:12px;color:#555}

  /* Modal */
  .modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;}
  .modal[open]{display:flex}
  .modal .modal-card{background:white;max-width:900px;width:100%;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);}
  .modal header{background:transparent;color:#17223b;padding:16px;border-bottom:1px solid #eee}
  .modal .content{padding:16px;max-height:70vh;overflow:auto}
  .modal footer{padding:12px 16px;border-top:1px solid #eee;display:flex;gap:8px;justify-content:flex-end}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field input,.field select{padding:8px;border:1px solid #cfd8dc;border-radius:6px}
  .kbd{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;background:#f1f5f9;border:1px solid #e2e8f0;border-bottom-width:2px;padding:1px 6px;border-radius:4px;font-size:12px}

  details{background:#fafbff;border:1px solid #e6ecff;border-radius:8px;padding:10px;margin:8px 0}
  details > summary{cursor:pointer;font-weight:bold}
  .success{color:var(--success)}
  .warn{color:var(--warn)}

  @media (prefers-reduced-motion: reduce){
    .progress-bar{transition:none}
  }
</style>
</head>
<body>
<header>
  <h1 id="appTitle">Academic Advising Decision Support Tool (Enhanced)</h1>
  <div class="app-actions" aria-label="App actions">
    <button id="btnRestart" title="Restart (Alt+R)">Restart</button>
    <button id="btnSave" title="Save session (Alt+S)">Save</button>
    <button id="btnLoad" title="Load session (Alt+L)">Load</button>
    <button id="btnExport" title="Export summary to JSON (Alt+J)">Export JSON</button>
    <button id="btnPrint" title="Print summary (Ctrl/Cmd+P)">Print</button>
    <button id="btnPlacement" title="Open placement helper (Alt+P)">Placement Helper</button>
  </div>
</header>
<div id="container">
  <div class="progress" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
  <div class="card" role="region" aria-labelledby="questionHeading">
    <div class="question" id="questionText" aria-live="polite"></div>
    <div class="options" id="optionsContainer" role="group" aria-label="Options"></div>
    <div class="summary" id="summaryBox" style="display:none;"></div>
    <div class="nav-controls">
      <div class="left">
        <button onclick="goBack()" id="btnBack" title="Go back (Alt+Left)">Back</button>
        <button onclick="restart()" id="btnRestartInline">Restart</button>
      </div>
      <div class="right">
        <span class="note">Tip: Use <span class="kbd">1</span>, <span class="kbd">2</span>, ... to choose options; <span class="kbd">B</span> to go Back.</span>
      </div>
    </div>
  </div>
</div>

<!-- Placement Helper Modal -->
<dialog class="modal" id="placementModal">
  <div class="modal-card">
    <header>
      <h2>Placement Helper</h2>
      <p class="note">Enter any scores you have; leave others blank.</p>
    </header>
    <div class="content">
      <div class="grid">
        <div class="field"><label>High School GPA</label><input type="number" step="0.01" id="ph_gpa" placeholder="e.g., 3.2"></div>
        <div class="field"><label>ACT Reading</label><input type="number" id="ph_act_read"></div>
        <div class="field"><label>ACT English (Writing & Language)</label><input type="number" id="ph_act_eng"></div>
        <div class="field"><label>ACT Math</label><input type="number" id="ph_act_math"></div>
        <div class="field"><label>SAT Evidence-Based Reading & Writing</label><input type="number" id="ph_sat_ebrw"></div>
        <div class="field"><label>SAT Writing & Language</label><input type="number" id="ph_sat_wl"></div>
        <div class="field"><label>SAT Math</label><input type="number" id="ph_sat_math"></div>
        <div class="field"><label>GED (if applicable)</label><input type="number" id="ph_ged"></div>
        <div class="field"><label>Accuplacer (Reading/Writing)</label><input type="number" id="ph_acc_rw"></div>
        <div class="field"><label>KYOTE College Algebra (CA)</label><input type="number" id="ph_kyote_ca"></div>
        <div class="field"><label>KYOTE Math Placement (MP)</label><input type="number" id="ph_kyote_mp"></div>
        <div class="field"><label>KYOTE KALG (CA - alternative)</label><input type="number" id="ph_kyote_kalg"></div>
      </div>
      <details open>
        <summary>Results</summary>
        <div id="placementResults"></div>
      </details>
    </div>
    <footer>
      <button onclick="document.getElementById('placementModal').close()">Close</button>
      <button class="success" onclick="computePlacement()">Recompute</button>
    </footer>
  </div>
</dialog>

<script>
// ================================

      "Approved Level I Programming (CIT 144 Python I @ SKYCTC)",
      "Approved Level II Programming (CIT 244 Python II @ SKYCTC)"
    ],
    generalEducation: [
      "College Writing I",
      "Qualitative Reasoning",

    ]
  },
  "Network Administration": {

    ],
    generalEducation: [

      "Natural Sciences",
      "Heritage and Humanities (Arts and Humanities)"
    ]
  }
};

// ================================
// Industry Certification -> Course Credit Map (NEW)
// ================================
const certificationCreditMap = {
  "iC3": ["CIT 95 (Digital Literacy Competency Only)"] ,
  "CIT 105 Step Exam": ["CIT 105"],
  "A+": ["CIT 111"],
  "MOS Word+PowerPoint+Excel+Access (2019/365)": ["CIT 130"],
  "Network+": ["CIT 160"],
  "CCNA": ["CIT 161","CIT 167","CIT 212"],
  "Security+": ["CIT 180"],
  "CEH": ["CIT 184"],
  "Linux+": ["CIT 217"],
  "Red Hat": ["CIT 227"]
};

// ================================
// DECISION TREE STRUCTURE (preserved + minor additions)
// ================================
const decisionTree = {
  start: {
    question: "Pre-Advising System Verification",
    options: [
      { text: "Begin System Review", next: "systemInstructions" }
    ]
  },
  systemInstructions: {
    question:
      "Step 1) Retrieve student's PeopleSoft ID Number (PS Number / Student ID):\n\n" +
      "Navigate to:\n" +
      "My Path > Student Self-Service (PeopleSoft Campus Solutions) > My Advisees.\n\n" +
      "Locate and record the student’s PS Number.\n\n" +
      "Step 2) Check student's current enrollment status and registered courses:\n\n" +
      "Navigate to:\n" +
      "My Path > Student Self-Service (PeopleSoft Campus Solutions) > Classic Home > My Favorites > PS Student Information.\n\n" +
      "Enter the PS Number in the ID field and click Search.\n\n" +
      "Review:\n" +
      "- Current term enrollment status\n" +
      "- Registered courses\n" +
      "- Academic program/plan information displayed",
    options: [
      { text: "System Review Complete – Continue", next: "majorCheck" },
      { text: "Open Placement Helper", next: "systemInstructions", action: () => openPlacementHelper() }
    ]
  },

  // MAJOR / TRACK CHECK
  majorCheck: {
    question:
      "Does the student need to be enrolled in the CIT Major (Plan) and/or one of the Tracks (Sub-Plan)?",
    options: [
      { text: "Yes", next: "majorUpdateInstructions", set: { needsMajorUpdate: true } },
      { text: "No", next: "trackSelection", set: { needsMajorUpdate: false } }
    ]
  },
  majorUpdateInstructions: {
    question:
      "Go to My Path > Student Self-Service (PeopleSoft Campus Solutions) > Change Major/Requirement Term.\n\n" +
      "Enter Student ID (PS number) and select term.\n\n" +
      "Leave 'Requirement Term Change' unselected.\n\n" +
      "Select:\n" +
      "- Program of Study: Computer and Information Technologies\n" +
      "- Academic Plan: Computer and Information Tech (Associate in Applied Science)\n\n" +
      "Select appropriate Academic Sub-Plan (Track).\n\n" +
      "This generates an email requiring student approval.\n\n" +
      "Notify the Division Administrative Assistant to update assigned advisor if necessary.",
    options: [
      { text: "Major/Track Update Submitted – Continue", next: "holdCheck" }
    ]
  },

  // HOLD CHECK
  holdCheck: {
    question:
      "Does the student have a HOLD (negative service indicator — red circle with line icon)?",
    options: [
      { text: "Yes", next: "holdInstructions", set: { hasHold: true } },
      { text: "No", next: "trackSelection", set: { hasHold: false } }
    ]
  },
  holdInstructions: {
    question:
      "Click the red service indicator icon.\n\n" +
      "On Manage Service Indicators page:\n" +
      "- Check Start Term.\n" +
      "- If not applicable to current term, you may continue.\n\n" +
      "If applicable:\n" +
      "- Click Code field to open View Service Indicator.\n" +
      "- Read Description box and Services Impacted section.\n\n" +
      "Notify student to resolve issue:\n\n" +
      "1) Transcript Hold → Review:\nhttps://southcentral.kctcs.edu/current-students/academic-resources/transcripts.aspx\nContact: SKY-Admission@kctcs.edu\n\n" +
      "2) Financial Aid Hold → Contact:\n southcentral-financialaid@kctcs.edu\n\n" +
      "3) Academic Hold → Contact:\n SKY-Admission@kctcs.edu",
    options: [
      { text: "Hold Addressed / Instructions Given – Continue", next: "trackSelection" }
    ]
  },

  // TRACK SELECTION
  trackSelection: {
    question: "Select the CIT AAS Track:",
    options: [
      { text: "Information Security", next: "trackCourseInput", set: { track: "Information Security" } },
      { text: "General", next: "trackCourseInput", set: { track: "General" } },
      { text: "Network Administration", next: "trackCourseInput", set: { track: "Network Administration" } },
      { text: "Internet Technologies", next: "trackCourseInput", set: { track: "Internet Technologies" } }
    ]
  },

  trackCourseInput: {
    question: "Select all courses the student has completed for the selected track.",
    options: [] // handled dynamically
  },

  credits: {
    question: "How many credit hours has the student completed?",
    options: [
      { text: "0-15 (First Semester)", next: "end", set: { credits: "0-15" } },
      { text: "16-45 (Mid Program)", next: "end", set: { credits: "16-45" } },
      { text: "46+ (Final Year)", next: "end", set: { credits: "46+" } }
    ]
  },

  end: {
    question: "Advising Recommendation Summary",
    options: []
  }
};

// ================================
// NAVIGATION ENGINE (preserved + keyboard & actions)
// ================================
let historyStack = [];
let currentNode = "start";

function renderNode(nodeKey){
  const node = decisionTree[nodeKey];
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";

  if(nodeKey === "trackCourseInput"){ renderCourseSelection(); return; }
  if(nodeKey === "end"){ renderSummary(); return; }

  document.getElementById("questionText").innerText = node.question;

  node.options.forEach((option, idx)=>{
    const btn = document.createElement("button");
    btn.innerText = option.text;
    btn.setAttribute('data-idx', idx+1);
    btn.onclick = () => {
      applyOption(option);
    };
    container.appendChild(btn);
  });
}

function applyOption(option){
  historyStack.push({ node: currentNode, profileSnapshot: JSON.parse(JSON.stringify(studentProfile)) });
  if(option.set){ Object.assign(studentProfile, option.set); }
  if(option.action){ try{ option.action(); }catch(e){ console.warn(e); } }
  currentNode = option.next;
  renderNode(currentNode);
  updateProgress(Math.min(historyStack.length * 10, 95));
}

function renderCourseSelection(){
  const q = "Track: " + studentProfile.track + "\n\nSelect all courses the student has completed:";
  document.getElementById("questionText").innerText = q;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";

  // Certifications section (NEW)
  const certWrap = document.createElement('div');
  certWrap.innerHTML = '<div class="section-title">Industry Certifications (auto-credit)</div>';
  const certList = document.createElement('div');
  Object.keys(certificationCreditMap).forEach(cert => {
    const label = document.createElement('label');
    label.style.display='block';
    label.style.margin='4px 0';
    const cb = document.createElement('input');
    cb.type='checkbox'; cb.value=cert;
    cb.checked = studentProfile.certifications.includes(cert);
    cb.onchange = () => { toggleCertification(cert, cb.checked); };
    label.appendChild(cb);
    label.appendChild(document.createTextNode(' ' + cert + ' '));
    const credits = certificationCreditMap[cert].map(c=>`<span class="pill">${c}</span>`).join(' ');
    const span = document.createElement('span'); span.className='note'; span.innerHTML = '→ credits: ' + credits;
    label.appendChild(span);
    certList.appendChild(label);
  });
  certWrap.appendChild(certList);
  container.appendChild(certWrap);

  const trackData = courseCatalog[studentProfile.track];

  // Filter bar
  const filterBar = document.createElement('div');
  filterBar.className = 'grid';
  filterBar.style.margin='8px 0';
  filterBar.innerHTML = `
    <div class="field"><label>Transcript/Prior Courses (paste list)</label>
      <textarea id="bulkCourses" rows="3" style="width:100%;padding:8px;border:1px solid #cfd8dc;border-radius:8px" placeholder="e.g., ENG 101, CIT 105, CIT 111..."></textarea>
    </div>
    <div class="field"><label>&nbsp;</label>
      <button id="btnBulkApply">Mark from List</button>
    </div>`;
  container.appendChild(filterBar);

  // Required Technical
  const section1 = document.createElement("div");
  section1.innerHTML = "<div class=\"section-title\">Required Technical Courses</div>";
  container.appendChild(section1);
  trackData.required.forEach(course => { addCheckbox(course, container); });

  // Track-Specific
  const section2 = document.createElement("div");
  section2.innerHTML = "<div class=\"section-title\">Track-Specific Courses</div>";
  container.appendChild(section2);
  trackData.trackSpecific.forEach(course => { addCheckbox(course, container); });

  // General Ed
  const section3 = document.createElement("div");
  section3.innerHTML = "<div class=\"section-title\">General Education Requirements</div>";
  container.appendChild(section3);
  trackData.generalEducation.forEach(requirement => {
    const wrapper = document.createElement("div");
    wrapper.style.margin = "6px 0";
    const label = document.createElement("span");
    label.innerText = requirement + ": ";
    label.style.display = "inline-block";
    label.style.width = "300px";
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "Enter course (e.g., ENG 101)";
    input.style.padding = "6px";
    input.style.width = "220px";
    input.dataset.requirement = requirement;
    input.value = studentProfile.generalEducationCourses?.[requirement] || "";
    wrapper.appendChild(label);
    wrapper.appendChild(input);
    container.appendChild(wrapper);
  });

  // Buttons
  const controls = document.createElement('div');
  controls.style.marginTop = '12px';
  const submitBtn = document.createElement("button");
  submitBtn.innerText = "Save Completed Courses and Continue";
  submitBtn.onclick = () => {
    // Capture checked CIT courses
    const selected = Array.from(container.querySelectorAll("input[type=checkbox][data-kind=course]:checked")).map(cb => cb.value);
    studentProfile.completedCourses = Array.from(new Set([...selected, ...studentProfile.creditedCourses]));

    // Capture Gen Ed inputs
    const genEdInputs = container.querySelectorAll("input[type=text]");
    let genEdData = {};
    genEdInputs.forEach(input => {
      const requirement = input.dataset.requirement;
      const value = input.value.trim();
      if(value !== ""){ genEdData[requirement] = value; }
    });
    studentProfile.generalEducationCourses = genEdData;

    currentNode = "credits";
    renderNode(currentNode);
    updateProgress(Math.min(historyStack.length * 10, 95));
  };
  controls.appendChild(submitBtn);

  const selectAllBtn = document.createElement('button');
  selectAllBtn.innerText = 'Select All Displayed';
  selectAllBtn.onclick = () => {
    container.querySelectorAll("input[type=checkbox][data-kind=course]").forEach(cb => cb.checked = true);
  };
  controls.appendChild(document.createTextNode(' '));
  controls.appendChild(selectAllBtn);

  container.appendChild(document.createElement("br"));
  container.appendChild(controls);

  // Bulk mark handler
  document.getElementById('btnBulkApply').onclick = () => {
    const list = (document.getElementById('bulkCourses').value||'').toUpperCase();
    container.querySelectorAll("input[type=checkbox][data-kind=course]").forEach(cb => {
      const code = cb.value.toUpperCase();
      if(list.includes(code)){ cb.checked = true; }
    });
  };

  // After rendering, apply any current certification credits to mark checkboxes
  applyCertificationCreditsToUI(container);
}

function addCheckbox(course, container){
  const label = document.createElement("label");
  label.style.display = "block";
  label.style.margin = "4px 0";
  const checkbox = document.createElement("input");
  checkbox.type = "checkbox";
  checkbox.value = course;
  checkbox.setAttribute('data-kind','course');
  label.appendChild(checkbox);
  label.appendChild(document.createTextNode(" " + course));
  container.appendChild(label);
}

function toggleCertification(cert, checked){
  if(checked){
    if(!studentProfile.certifications.includes(cert)) studentProfile.certifications.push(cert);
  }else{
    studentProfile.certifications = studentProfile.certifications.filter(c => c!==cert);
  }
  // Recompute credited courses
  const all = new Set();
  studentProfile.certifications.forEach(c => certificationCreditMap[c].forEach(k => all.add(k)));
  studentProfile.creditedCourses = Array.from(all);

  // Keep UI in sync
  const container = document.getElementById('optionsContainer');
  applyCertificationCreditsToUI(container);
}

function applyCertificationCreditsToUI(container){
  if(!container) return;
  const credited = new Set(studentProfile.creditedCourses);
  container.querySelectorAll("input[type=checkbox][data-kind=course]").forEach(cb => {
    if(credited.has(cb.value)){
      cb.checked = true;
      cb.disabled = true; // indicate auto-credit
      cb.parentElement.title = 'Credited by certification';
      cb.parentElement.style.opacity = .85;
    }else{
      cb.disabled = false;
      cb.parentElement.style.opacity = 1;
    }
  });
}

function goBack(){
  if(historyStack.length > 0){
    const lastState = historyStack.pop();
    currentNode = lastState.node;
    studentProfile = lastState.profileSnapshot;
    renderNode(currentNode);
    updateProgress(Math.max(historyStack.length * 10, 0));
  }
}

function restart(){
  historyStack = [];
  currentNode = 'start';
  studentProfile = { program: "Computer & Information Technologies AAS", track:null, credits:null, transferStudent:null, remedial:null, needsMajorUpdate:null, hasHold:null, completedCourses:[], generalEducationCourses:{}, certifications:[], creditedCourses:[] };
  renderNode(currentNode);
  updateProgress(0);
}

function updateProgress(percent){
  document.getElementById("progressBar").style.width = percent + "%";
}

// ================================
// Summary & Remaining Coursework (NEW)
// ================================
function renderSummary(){
  const box = document.getElementById('summaryBox');
  box.style.display = 'block';

  const track = studentProfile.track;
  const trackData = courseCatalog[track] || {required:[], trackSpecific:[], generalEducation:[]};
  const completed = new Set(studentProfile.completedCourses);

  const reqs = [...trackData.required, ...trackData.trackSpecific];
  const remaining = reqs.filter(req => !isRequirementSatisfied(req, completed));
  const satisfied = reqs.filter(req => isRequirementSatisfied(req, completed));

  const genEdReqs = trackData.generalEducation;
  const completedGenEdKeys = new Set(Object.keys(studentProfile.generalEducationCourses||{}));
  const remainingGenEd = genEdReqs.filter(k => !completedGenEdKeys.has(k));

  const creditedPills = (studentProfile.creditedCourses||[]).map(c=>`<span class="pill">${c}</span>`).join(' ');

  box.innerHTML = `
    <strong>Program:</strong> ${studentProfile.program}<br>
    <strong>Needs Major Update:</strong> ${studentProfile.needsMajorUpdate === null ? 'Unknown' : (studentProfile.needsMajorUpdate ? 'Yes':'No')}<br>
    <strong>Has Hold:</strong> ${studentProfile.hasHold === null ? 'Unknown' : (studentProfile.hasHold ? 'Yes':'No')}<br>
    <strong>Track:</strong> ${track || 'Not Selected'}<br>
    <strong>Credits Completed:</strong> ${studentProfile.credits || 'Unknown'}
    <hr>
    <div><strong>Completed (including certification credits):</strong><br>
      ${Array.from(completed).map(c=>`<span class="pill">${c}</span>`).join(' ') || '<span class="note">None selected</span>'}
    </div>
    ${creditedPills ? `<div class="note">Auto-credited by certifications: ${creditedPills}</div>` : ''}
    <div style="margin-top:8px"><strong>Remaining Program/Track Courses:</strong><br>
      ${remaining.length? remaining.map(c=>`<span class="pill">${c}</span>`).join(' ') : '<span class="success">No remaining courses detected based on selections</span>'}
    </div>
    <div style="margin-top:8px"><strong>General Education Entered:</strong><br>
      ${Object.entries(studentProfile.generalEducationCourses||{}).map(([k,v])=>`<span class="pill">${k}: ${v}</span>`).join(' ') || '<span class="note">None entered</span>'}
    </div>
    <div style="margin-top:8px"><strong>Remaining General Education Attributes:</strong><br>
      ${remainingGenEd.length? remainingGenEd.map(c=>`<span class="pill">${c}</span>`).join(' ') : '<span class="success">All GenEd attributes recorded</span>'}
    </div>
    <hr>
    <div class="note">Use the buttons in the header to Save, Load, Export JSON, or Print this summary.</div>
  `;

  // also render a finish button area
  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  const done = document.createElement('button');
  done.innerText = 'Finish & Show Summary';
  done.onclick = () => window.scrollTo({top:0,behavior:'smooth'});
  container.appendChild(done);

  // Export JSON object ready
  latestSummaryObject = {
    timestamp: new Date().toISOString(),
    studentProfile,
    trackData,
    satisfied,
    remaining,
    remainingGenEd
  };
}

function isRequirementSatisfied(req, completedSet){
  // Handle patterns like "CIT 160/161" or "CIT 144 or 171" or "CIT 257 or CIT 258"
  const normalized = req.replace(/\s+/g,' ').trim();
  if(normalized.includes('/')){
    const parts = normalized.split('/').map(s => s.trim());
    return parts.some(p => completedSet.has(p));
  }
  if(/\bor\b/i.test(normalized)){
    // Split on ' or '
    const parts = normalized.split(/\bor\b/i).map(s => s.trim());
    return parts.some(p => completedSet.has(p));
  }
  // Generic placeholders like "CIT Elective" can't be auto-satisfied; assume not satisfied
  if(/elective/i.test(normalized) || /Approved Level/i.test(normalized)){
    return false;
  }
  return completedSet.has(normalized);
}

// ================================
// Save / Load / Export / Print (NEW)
// ================================
function saveSession(){
  const payload = { version: 1, currentNode, historyStack, studentProfile };
  localStorage.setItem('advisor_session', JSON.stringify(payload));
  toast('Session saved');
}
function loadSession(){
  try{
    const raw = localStorage.getItem('advisor_session');
    if(!raw) return toast('No saved session found');
    const data = JSON.parse(raw);
    currentNode = data.currentNode || 'start';
    historyStack = data.historyStack || [];
    studentProfile = data.studentProfile || studentProfile;
    renderNode(currentNode);
    updateProgress(Math.min(historyStack.length * 10, 95));
    toast('Session loaded');
  }catch(e){ toast('Failed to load session'); }
}
function exportJSON(){
  const blob = new Blob([JSON.stringify(latestSummaryObject || {studentProfile}, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'advising-summary.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function printSummary(){ window.print(); }

let latestSummaryObject = null;

// Simple toast
function toast(msg){
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = 'position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 12px;border-radius:6px;opacity:.95;z-index:9999';
  document.body.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 1600);
}

// ================================
// Placement Helper Logic (NEW)
// ================================
function openPlacementHelper(){ document.getElementById('placementModal').showModal(); computePlacement(); }
function computePlacement(){
  const gpa = parseFloat(document.getElementById('ph_gpa').value);
  const actR = parseFloat(document.getElementById('ph_act_read').value);
  const actE = parseFloat(document.getElementById('ph_act_eng').value);
  const actM = parseFloat(document.getElementById('ph_act_math').value);
  const satEBRW = parseFloat(document.getElementById('ph_sat_ebrw').value);
  const satWL = parseFloat(document.getElementById('ph_sat_wl').value);
  const satM = parseFloat(document.getElementById('ph_sat_math').value);
  const ged = parseFloat(document.getElementById('ph_ged').value);
  const accuRW = parseFloat(document.getElementById('ph_acc_rw').value);
  const kyCA = parseFloat(document.getElementById('ph_kyote_ca').value);
  const kyMP = parseFloat(document.getElementById('ph_kyote_mp').value);
  const kyKALG = parseFloat(document.getElementById('ph_kyote_kalg').value);

  // ENG 101 placement
  const engDirect = (
    (actR>=20 || satEBRW>=490 || (accuRW>=250) || (ged>=165) || (gpa>=3.0)) &&
    (actE>=18 || satWL>=22 || satEBRW>=490 || (accuRW>=250) || (ged>=165) || (gpa>=3.0))
  );
  const engPaired = (
    ((actR>=16 && actR<=19) || (accuRW>=228 && accuRW<=249) || (gpa>=2.0 && gpa<3.0)) &&
    ((actE>=16 && actE<=19) || (accuRW>=228 && accuRW<=249) || (gpa>=2.0 && gpa<3.0))
  );
  const engReferral = ( (actR>0 && actR<=15) || (actE>0 && actE<=13) );

  let engPlacement = 'Insufficient data';
  if(engDirect){ engPlacement = 'ENG 101'; }
  else if(engPaired){ engPlacement = 'ENG 101 + IRW 100 + FYE 110 (coreq)'; }
  else if(engReferral){ engPlacement = 'Referral to Adult Education'; }

  // Math placement – Qualitative Reasoning attribute
  let mathPlacement = 'Insufficient data';
  if(actM>=27 || satM>=640 || kyCA>=15){ mathPlacement = 'Eligible for MAT 175'; }
  else if((actM>=22 && actM<=26) || (satM>=540 && satM<=639) || (gpa>=3.2) || kyCA>=14){ mathPlacement = 'Eligible for MAT 150 or MAT 155'; }
  else if((actM>=19 && actM<=21) || (satM>=510 && satM<=539) || (ged>=165 && ged<=174) || (gpa>=3.0 && gpa<=3.19) || (kyCA>=7 && kyCA<=13) || (kyMP>=22)){
    mathPlacement = 'Eligible for MAT 150 (with MAT 100 coreq), or MAT 146/126/105';
  }

  const html = `
    <p><strong>English (College Writing I):</strong> <span>${engPlacement}</span></p>
    <ul class="note">
      <li>If <em>ENG 101</em>, then student meets the College Writing I attribute.</li>
      <li>If <em>ENG 101 + IRW 100 + FYE 110</em>, schedule those together.</li>
      <li>If <em>Referral</em>, student should work with Adult Education.</li>
    </ul>
    <p><strong>Math (Qualitative Reasoning attribute):</strong> <span>${mathPlacement}</span></p>`;
  document.getElementById('placementResults').innerHTML = html;
}

// ================================
// Keyboard shortcuts
// ================================
window.addEventListener('keydown', (e)=>{
  if(e.altKey && e.key.toLowerCase()==='r'){ e.preventDefault(); restart(); }
  if(e.altKey && e.key.toLowerCase()==='s'){ e.preventDefault(); saveSession(); }
  if(e.altKey && e.key.toLowerCase()==='l'){ e.preventDefault(); loadSession(); }
  if(e.altKey && e.key.toLowerCase()==='j'){ e.preventDefault(); exportJSON(); }
  if(e.ctrlKey && e.key.toLowerCase()==='p'){ /* allow print */ }
  if(e.altKey && e.key.toLowerCase()==='p'){ e.preventDefault(); openPlacementHelper(); }
  if(e.key.toLowerCase()==='b'){ e.preventDefault(); goBack(); }
  // numeric select
  if(!isNaN(parseInt(e.key))){
    const idx = parseInt(e.key);
    const btn = document.querySelector(`#optionsContainer button[data-idx='${idx}']`);
    if(btn){ btn.click(); }
  }
});

// Header action buttons
document.getElementById('btnRestart').onclick = restart;
document.getElementById('btnSave').onclick = saveSession;
document.getElementById('btnLoad').onclick = loadSession;
document.getElementById('btnExport').onclick = exportJSON;
document.getElementById('btnPrint').onclick = printSummary;
document.getElementById('btnPlacement').onclick = openPlacementHelper;

// Initialize
renderNode(currentNode);
updateProgress(0);
</script>
